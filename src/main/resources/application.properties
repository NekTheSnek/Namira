server.port=${PORT:8080}
spring.application.name=Namira

# Database - Χρησιμοποιούμε τις μεταβλητές του Railway
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# ΚΡΙΣΙΜΟ: Το 'none' σταματάει το αυτόματο χτίσιμο που προκαλεί το crash
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Επιτρέπει στο Spring να καταλάβει το σωστό URL πίσω από το Proxy
server.forward-headers-strategy=native

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://namira-production.up.railway.app/login/oauth2/code/google