server.port=${PORT:8080}
spring.application.name=Namira

# Database - Με το host από το image_398581.png
spring.datasource.url=jdbc:postgresql://viaduct.proxy.rlwy.net:23456/railway
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Απενεργοποίηση ελέγχου για να ξεκινήσει σίγουρα
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.forward-headers-strategy=native

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://namira-production.up.railway.app/login/oauth2/code/google