server.port=${PORT:8080}
spring.application.name=Namira

# Database
spring.datasource.url=jdbc:postgresql://viaduct.proxy.rlwy.net:23456/railway
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# ΚΡΙΣΙΜΟ: Χρησιμοποιούμε 'create' για να ξαναχτιστεί ο πίνακας σωστά
# Μόλις δεις ότι δουλεύει, άλλαξέ το πίσω σε 'update'
spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Επιτρέπει στο Spring να καταλάβει το σωστό URL πίσω από το Proxy
server.forward-headers-strategy=native

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://namira-production.up.railway.app/login/oauth2/code/google