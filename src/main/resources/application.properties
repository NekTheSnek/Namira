server.port=${PORT:8080}
spring.application.name=Namira

# Database
spring.datasource.url=jdbc:postgresql://viaduct.proxy.rlwy.net:23456/railway
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Επαναφορά στο update για να διαβάζει τα δεδομένα που ήδη υπάρχουν
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Αυτό χρειάζεται για να δουλεύει το site (redirects)
server.forward-headers-strategy=native

# Google OAuth2 - Απαραίτητο για το site
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://namira-production.up.railway.app/login/oauth2/code/google